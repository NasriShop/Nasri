# Render Blueprint - ZoubirNasriShop (موقع ثابت Static Site)
# ضع هذا الملف في جذر المستودع (بجانب مجلد public)
# مهم: index.html يجب أن يكون داخل المجلد المذكور في staticPublishPath

services:
  - type: web
    runtime: static
    name: zoubirnasrishop
    # لا يوجد بناء: الموقع ملف HTML واحد
    buildCommand: echo "static site - no build"
    # المجلد الذي يحتوي index.html (غيّره إلى . إذا كان index.html في الجذر)
    staticPublishPath: ./public
    autoDeploy: true

    headers:
      # حماية عامة لكل الصفحات
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: X-Frame-Options
        value: DENY
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
      - path: /*
        name: Permissions-Policy
        value: camera=(), microphone=(), geolocation=(), payment=()
      - path: /*
        name: Strict-Transport-Security
        value: max-age=31536000
      # الصفحة الرئيسية دائماً محدّثة (حتى يرى الزبائن آخر نسخة)
      - path: /index.html
        name: Cache-Control
        value: no-cache
