<!DOCTYPE html>
<html lang="ar" dir="rtl" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="ZoubirNasriShop — متجر إلكتروني جزائري: منتجات مختارة بعناية، الدفع عند الاستلام والتوصيل إلى 58 ولاية.">
<meta name="theme-color" content="#FF6A00">
<title>ZoubirNasriShop — متجر إلكتروني</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="preconnect" href="https://res.cloudinary.com" crossorigin>
<link rel="preconnect" href="https://firestore.googleapis.com" crossorigin>
<script>
/* ضغط وتصغير أي صورة Cloudinary (حتى القديمة) حسب العرض المطلوب */
window.znCimg=function(u,w){
  if(typeof u!=='string') return u;
  var m=/^(https:\/\/res\.cloudinary\.com\/[^\/]+\/image\/upload\/)(.*)$/.exec(u); if(!m) return u;
  var rest=m[2].replace(/^f_auto,q_auto,(?:c_limit,)?w_\d+\//,'');
  if(/^[a-z]{1,3}_[^\/]*\//.test(rest)) return u;   /* تحويل مخصص من صاحب المتجر: لا نلمسه */
  return m[1]+'f_auto,q_auto,c_limit,w_'+w+'/'+rest;
};
window.znPid=function(){
  try{
    var q=new URLSearchParams(location.search), v=q.get('p'); if(v) return v;
    var ks=Array.from(q.keys()), i; for(i=0;i<ks.length;i++){ if(/^p_[A-Za-z0-9_-]+$/.test(ks[i])) return ks[i]; }
    var h=/^#(p_[A-Za-z0-9_-]+)$/.exec(location.hash); return h?h[1]:null;
  }catch(e){ return null; }
};
window.znSet=function(u,ws){
  if(typeof u!=='string' || window.znCimg(u,ws[0])===u) return '';
  return ws.map(function(w){return window.znCimg(u,w)+' '+w+'w';}).join(', ');
};
/* تحميل مسبق لصورة الغلاف للزائر العائد (المعلومات محفوظة من الزيارة السابقة) */
try{var h=(window.znPid())?null:JSON.parse(localStorage.getItem('zn_hero')||'null');if(h&&h.set){var l=document.createElement('link');l.rel='preload';l.as='image';l.setAttribute('imagesrcset',h.set);l.setAttribute('imagesizes',h.sizes);l.setAttribute('fetchpriority','high');document.head.appendChild(l);}}catch(e){}
</script>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" media="print" onload="this.media='all'">
<noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap"></noscript>
<style>
/* mini reset (remplace Tailwind preflight) */
*,::before,::after{box-sizing:border-box;border:0 solid}
body{margin:0}h1,h2,h3,h4,h5,h6,p,ul,ol,figure,blockquote,dl,dd{margin:0}
h1,h2,h3,h4,h5,h6{font-size:inherit;font-weight:inherit}
ul,ol{list-style:none;padding:0}a{color:inherit;text-decoration:inherit}
img,svg,video{display:block;max-width:100%}img,video{height:auto}
button,input,select,textarea{font:inherit;color:inherit;margin:0}
button{background:transparent;cursor:pointer}table{border-collapse:collapse}
textarea{resize:vertical}[hidden],.hidden{display:none}
</style>
<style>
:root{
  --bg:#FFF8F1; --surface:#FFFFFF; --surface-2:#FFF1E1;
  --ink:#241539; --muted:#6A5B7C; --line:#F1E1CE;
  --brand:#FF6A00; --brand-soft:#FFE7CC; --brand-ink:#A63E00;
  --accent:#8B2FE0; --accent-soft:#F1E3FC; --accent-ink:#6B1FB0;
  --gold:#FFB800; --gold-soft:#FFF2CC;
  --grad:linear-gradient(135deg,var(--brand),var(--accent));
  --shadow:0 1px 2px rgba(36,21,57,.07), 0 10px 26px -12px rgba(36,21,57,.22);
  box-sizing:border-box;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#181022; --surface:#231732; --surface-2:#2C1F40;
    --ink:#F6EFFF; --muted:#B6A6CC; --line:#392B4D;
    --brand:#FF8A3D; --brand-soft:#3A2412; --brand-ink:#FFB37A;
    --accent:#B98CFF; --accent-soft:#2C2145; --accent-ink:#D8C2FF;
    --gold:#FFCB4D; --gold-soft:#3A2E0E;
    --shadow:0 1px 2px rgba(0,0,0,.4), 0 10px 30px -14px rgba(0,0,0,.7);
  }
}
:root[data-theme="dark"]{
  --bg:#181022; --surface:#231732; --surface-2:#2C1F40;
  --ink:#F6EFFF; --muted:#B6A6CC; --line:#392B4D;
  --brand:#FF8A3D; --brand-soft:#3A2412; --brand-ink:#FFB37A;
  --accent:#B98CFF; --accent-soft:#2C2145; --accent-ink:#D8C2FF;
  --gold:#FFCB4D; --gold-soft:#3A2E0E;
  --shadow:0 1px 2px rgba(0,0,0,.4), 0 10px 30px -14px rgba(0,0,0,.7);
}
*,*::before,*::after{box-sizing:border-box}
html{scroll-padding-top: calc(72px + env(safe-area-inset-top, 0px)); -webkit-text-size-adjust:100%}
body{
  margin:0; background:var(--bg); color:var(--ink);
  font-family:"Cairo","Outfit",system-ui,-apple-system,"Segoe UI",sans-serif;
  font-size:16px; line-height:1.65; overflow-x:hidden;
}
html[dir="ltr"] body{font-family:"Outfit","Cairo",system-ui,sans-serif}
h1,h2,h3{line-height:1.25; margin:0; font-weight:800; letter-spacing:-.01em}
img{max-width:100%; display:block}
button,input,select,textarea{font:inherit; color:inherit}
a{color:inherit}
:focus-visible{outline:3px solid var(--brand); outline-offset:2px; border-radius:6px}
::selection{background:var(--brand); color:#fff}

/* ---------- shared bits ---------- */
.wrap{width:100%; max-width:1180px; margin-inline:auto; padding-inline:16px}
.card{background:var(--surface); border:1px solid var(--line); border-radius:20px; box-shadow:var(--shadow)}
.btn{display:inline-flex; align-items:center; justify-content:center; gap:8px; border:1px solid transparent;
  border-radius:999px; padding:11px 20px; font-weight:700; cursor:pointer; background:var(--surface-2); color:var(--ink);
  transition:transform .12s ease, background .18s ease, box-shadow .18s ease}
.btn:active{transform:scale(.97)}
.btn-primary{background:var(--brand); color:#fff; box-shadow:0 6px 18px -8px var(--brand)}
.btn-primary:hover{background:var(--brand-ink)}
.btn-accent{background:var(--accent); color:#fff; box-shadow:0 8px 22px -10px var(--accent)}
.btn-ghost{background:transparent; border-color:var(--line)}
.btn-sm{padding:7px 14px; font-size:.85rem}
.field{width:100%; background:var(--surface); border:1.5px solid var(--line); border-radius:14px; padding:12px 14px;
  transition:border-color .15s ease, box-shadow .15s ease}
.field:focus{border-color:var(--brand); box-shadow:0 0 0 4px var(--brand-soft); outline:none}
label.lbl{display:block; font-size:.82rem; font-weight:700; color:var(--muted); margin-bottom:6px}
.price{font-family:"Outfit","Cairo",sans-serif; font-weight:800; font-variant-numeric:tabular-nums}
.badge{display:inline-flex; align-items:center; gap:6px; background:var(--brand-soft); color:var(--brand-ink);
  border-radius:999px; padding:4px 12px; font-size:.78rem; font-weight:700}
.badge-accent{background:var(--accent-soft); color:var(--accent)}
.hidden{display:none !important}

/* ---------- orders dashboard: stats & filters ---------- */
.stat-grid{display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:12px; margin-bottom:16px}
.stat-card{position:relative; overflow:hidden; background:var(--surface); border:1px solid var(--line);
  border-radius:18px; padding:16px 18px 14px; box-shadow:var(--shadow);
  transition:transform .15s ease, box-shadow .15s ease}
.stat-card:hover{transform:translateY(-3px); box-shadow:0 16px 32px -16px rgba(15,31,27,.28)}
.stat-card::before{content:""; position:absolute; inset-inline-start:0; top:0; bottom:0; width:5px;
  background:var(--stat-c, var(--brand))}
.stat-icon{font-size:1.25rem; line-height:1; display:block; margin-bottom:10px}
.stat-label{font-size:.78rem; font-weight:700; color:var(--muted); margin-bottom:4px}
.stat-value{font-family:"Outfit","Cairo",sans-serif; font-weight:900; font-size:1.55rem;
  color:var(--stat-c, var(--ink))}
.filter-bar{display:flex; align-items:center; gap:10px; flex-wrap:wrap; background:var(--surface);
  border:1px solid var(--line); border-radius:18px; padding:12px 14px; margin-bottom:16px; box-shadow:var(--shadow)}
.seg{display:flex; background:var(--surface-2); border-radius:999px; padding:3px; gap:2px}
.seg button{border:none; background:transparent; padding:8px 16px; border-radius:999px; font-weight:700;
  font-size:.85rem; cursor:pointer; color:var(--muted); transition:background .15s ease, color .15s ease}
.seg button.on{background:var(--brand); color:#fff; box-shadow:0 4px 12px -4px var(--brand)}
.filter-bar input[type="date"]{background:var(--surface); border:1.5px solid var(--line); border-radius:12px;
  padding:8px 10px; font-size:.85rem; color:var(--ink)}
.status-pill{display:inline-flex; align-items:center; gap:6px; padding:5px 12px; border-radius:999px;
  font-size:.78rem; font-weight:800}
.scroll-x{overflow-x:auto; -webkit-overflow-scrolling:touch}
.muted{color:var(--muted)}

/* ---------- header ---------- */
header.topbar{position:relative; position:sticky; top:env(safe-area-inset-top, 0px); z-index:50;
  background:color-mix(in srgb, var(--surface) 88%, transparent); backdrop-filter:blur(12px);
  border-bottom:1px solid var(--line)}
header.topbar::after{content:""; position:absolute; inset-inline:0; bottom:-2px; height:2px; background:var(--grad)}
.logo{display:flex; align-items:center; gap:10px; cursor:pointer; user-select:none}
.logo-mark{width:38px; height:38px; border-radius:12px; background:var(--grad);
  color:#fff; display:grid; place-items:center; font-family:"Outfit",sans-serif; font-weight:800; font-size:1.05rem;
  box-shadow:0 6px 16px -6px var(--brand)}
.logo-txt{font-family:"Outfit",sans-serif; font-weight:800; font-size:1.02rem; letter-spacing:-.02em}
.logo-txt span{color:var(--accent)}
.lang-pill{display:flex; background:var(--surface-2); border-radius:999px; padding:3px; gap:2px}
.lang-pill button{border:0; background:transparent; border-radius:999px; padding:5px 11px; font-size:.78rem; font-weight:700;
  cursor:pointer; color:var(--muted)}
.lang-pill button[aria-pressed="true"]{background:var(--surface); color:var(--brand); box-shadow:var(--shadow)}

/* ---------- hero ---------- */
.hero{position:relative; border-radius:28px; overflow:hidden; background:var(--surface); border:1px solid var(--line);
  box-shadow:var(--shadow)}
.hero-grid{display:grid; grid-template-columns:1fr; gap:0}
@media(min-width:820px){ .hero-grid{grid-template-columns:1.05fr .95fr} }
.hero-media{position:relative; background:var(--surface-2); aspect-ratio:4/3; overflow:hidden}
.hero-media img{width:100%; height:100%; object-fit:cover}
.hero-body{padding:26px 22px 28px; display:flex; flex-direction:column; justify-content:center; gap:14px}
@media(min-width:820px){ .hero-body{padding:40px 38px} .hero-media{aspect-ratio:auto; min-height:420px} }
.hero-title{font-size:clamp(1.55rem,4.6vw,2.5rem)}
.strike{color:var(--muted); text-decoration:line-through; font-weight:600}

/* ---------- product grid ---------- */
.grid-products{display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:14px}
@media(min-width:680px){ .grid-products{grid-template-columns:repeat(3,minmax(0,1fr)); gap:18px} }
@media(min-width:1000px){ .grid-products{grid-template-columns:repeat(4,minmax(0,1fr))} }
.pcard{background:var(--surface); border:1px solid var(--line); border-radius:20px; overflow:hidden; cursor:pointer;
  display:flex; flex-direction:column; transition:transform .18s ease, box-shadow .18s ease, border-color .18s ease}
.pcard:hover{transform:translateY(-3px); box-shadow:var(--shadow); border-color:color-mix(in srgb,var(--brand) 40%,var(--line))}
.pcard-media{position:relative; aspect-ratio:1/1; background:var(--surface-2); overflow:hidden}
.pcard-media img{width:100%; height:100%; object-fit:cover; transition:transform .5s cubic-bezier(.2,.7,.3,1)}
.pcard:hover .pcard-media img{transform:scale(1.07)}
.pcard-body{padding:11px 13px 14px; display:flex; flex-direction:column; gap:6px; flex:1}
.pcard-name{font-weight:700; font-size:.95rem; line-height:1.4;
  display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden}
.ribbon{position:absolute; inset-inline-start:10px; top:10px; z-index:2}

/* ---------- product landing ---------- */
.gallery{display:flex; flex-direction:column; gap:14px}
.gimg{width:100%; border-radius:22px; overflow:hidden; background:var(--surface-2); border:1px solid var(--line)}
.gimg img{width:100%; height:auto; object-fit:contain; cursor:zoom-in; transition:transform .45s cubic-bezier(.2,.7,.3,1)}
.gimg.zoomed img{transform:scale(1.9); cursor:zoom-out}
.desc-html{line-height:1.9; max-width:100%; overflow-wrap:anywhere}
.desc-html img{max-width:100%; height:auto; border-radius:16px; margin:12px auto; display:block}
.desc-html h2,.desc-html h3{margin:18px 0 8px; font-size:1.15rem}
.desc-html ul{padding-inline-start:22px; margin:10px 0}
.desc-html li{margin:5px 0}
.desc-html p{margin:10px 0}
.desc-html table{border-collapse:collapse; width:100%; min-width:0}
.desc-html td,.desc-html th{border:1px solid var(--line); padding:7px 10px; font-size:.9rem}
.desc-html .tbl-wrap{max-width:100%; overflow-x:auto; -webkit-overflow-scrolling:touch; border-radius:10px}
.desc-html iframe,.desc-html video{max-width:100%; width:100%; aspect-ratio:16/9; border:0; border-radius:16px}
.desc-html pre{max-width:100%; overflow-x:auto}
.desc-html *{max-width:100%}

/* description content comes from admin-pasted HTML that may ship its own
   full page (<style>, fixed widths, <div id="root">…). Rendering it inline
   let that CSS leak onto the whole storefront and break the layout on every
   screen size — see the isolated-frame fix in mountDescFrame(). The frame
   itself is width:100% and its height is measured and re-applied from JS so
   it always matches its content, on phone and desktop alike. */
.desc-frame-wrap{width:100%; max-width:100%; overflow:hidden}
.desc-frame{display:block; width:100%; border:0; background:transparent; min-height:60px}

/* ---------- category filter ---------- */
.cat-bar{display:flex; gap:10px; overflow-x:auto; -webkit-overflow-scrolling:touch; padding:2px 2px 10px}
.cat-pill{display:flex; align-items:center; gap:7px; white-space:nowrap; flex:0 0 auto; cursor:pointer;
  border:1.5px solid var(--line); background:var(--surface); border-radius:999px; padding:9px 16px;
  font-weight:700; font-size:.86rem; color:var(--ink); transition:transform .15s ease, box-shadow .15s ease, border-color .15s ease}
.cat-pill:hover{transform:translateY(-2px)}
.cat-pill .ic{font-size:1.05rem; line-height:1}
.cat-pill[data-on="1"]{background:var(--grad); color:#fff; border-color:transparent; box-shadow:0 8px 18px -8px var(--brand)}
.order-box{position:relative}
@media(min-width:960px){
  .pdp{display:grid; grid-template-columns:1.15fr .85fr; gap:30px; align-items:start}
  .order-box{position:sticky; top:96px}
}
.radio-card{display:flex; align-items:center; gap:10px; border:1.5px solid var(--line); border-radius:16px; padding:12px 14px;
  cursor:pointer; background:var(--surface); flex:1; transition:border-color .15s, background .15s}
.radio-card[data-on="1"]{border-color:var(--brand); background:var(--brand-soft)}
.qty{display:flex; align-items:center; gap:0; border:1.5px solid var(--line); border-radius:999px; overflow:hidden; width:fit-content}
.qty button{width:40px; height:40px; border:0; background:var(--surface-2); font-size:1.1rem; font-weight:800; cursor:pointer}
.qty span{min-width:48px; text-align:center; font-weight:800}

/* ---------- order form (ofm) ---------- */
.ofm{padding:0 !important; overflow:hidden}
.ofm::before{content:""; display:block; height:5px; background:var(--grad)}
.ofm-head{display:flex; align-items:center; gap:12px; padding:18px 20px 0}
.ofm-spark{width:46px; height:46px; flex:none; border-radius:15px; background:var(--grad); display:grid; place-items:center;
  font-size:1.35rem; box-shadow:0 10px 20px -10px var(--brand)}
.ofm-head h2{font-size:1.15rem; font-weight:900; line-height:1.25}
.ofm-head p{font-size:.8rem; color:var(--muted); margin-top:2px}
.ofm-body{padding:16px 20px 20px; display:grid; gap:14px}
.ofm-grp{display:grid; gap:11px; background:var(--surface-2); border:1px solid var(--line); border-radius:20px; padding:14px}
.ofm-step{display:flex; align-items:center; gap:9px; font-weight:800; font-size:.88rem}
.ofm-step b{width:25px; height:25px; flex:none; border-radius:50%; background:var(--grad); color:#fff; display:grid; place-items:center;
  font-size:.78rem; font-family:"Outfit","Cairo",sans-serif}
.ofm .field{height:50px; font-weight:600; background:var(--surface)}
.ofm textarea.field{height:auto}
.ofm .field.err{border-color:#E5484D; box-shadow:0 0 0 4px rgba(229,72,77,.16); animation:ofmShake .35s}
.ofm .ic{position:relative}
.ofm .ic > em{position:absolute; inset-inline-start:14px; top:50%; transform:translateY(-50%); font-style:normal; font-size:1.05rem; pointer-events:none}
.ofm .ic > .field{padding-inline-start:46px}
.ofm-two{display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:10px}
.ofm .sel{position:relative}
.ofm .sel select{appearance:none; -webkit-appearance:none; padding-inline-end:38px; cursor:pointer; text-overflow:ellipsis}
.ofm .sel::after{content:""; position:absolute; inset-inline-end:17px; top:50%; width:8px; height:8px; pointer-events:none;
  border-inline-end:2px solid var(--muted); border-bottom:2px solid var(--muted); transform:translateY(-72%) rotate(45deg)}
.ofm-del{display:grid; grid-template-columns:1fr 1fr; gap:10px}
.dcard{position:relative; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:5px; text-align:center;
  border:2px solid var(--line); background:var(--surface); border-radius:18px; padding:14px 8px 12px; cursor:pointer;
  transition:border-color .18s, background .18s, transform .18s, box-shadow .18s}
.dcard input{position:absolute; opacity:0; pointer-events:none}
.dcard .di{font-size:1.75rem; line-height:1}
.dcard .dl{font-size:.8rem; font-weight:800; line-height:1.3}
.dcard .price{font-size:1.02rem; color:var(--muted)}
.dcard::after{content:"✓"; position:absolute; top:8px; inset-inline-end:8px; width:21px; height:21px; border-radius:50%; background:var(--grad);
  color:#fff; font-size:.72rem; font-weight:900; display:grid; place-items:center; transform:scale(0); transition:transform .2s cubic-bezier(.3,1.6,.5,1)}
.dcard:hover{border-color:var(--brand)}
.dcard[data-on="1"]{border-color:var(--brand); background:var(--brand-soft); box-shadow:0 12px 24px -16px var(--brand); transform:translateY(-2px)}
.dcard[data-on="1"]::after{transform:scale(1)}
.dcard[data-on="1"] .price{color:var(--brand-ink)}
.dcard:focus-within{outline:3px solid var(--brand-soft); outline-offset:2px}
.ofm-qrow{display:flex; align-items:center; justify-content:space-between; gap:12px}
.ofm .qty{background:var(--surface); border:0; box-shadow:inset 0 0 0 1.5px var(--line); border-radius:999px; padding:4px; gap:2px}
.ofm .qty button{width:42px; height:42px; border-radius:50%; background:var(--grad); color:#fff; font-size:1.3rem; line-height:1;
  box-shadow:0 8px 16px -10px var(--brand); transition:transform .12s}
.ofm .qty button:active{transform:scale(.86)}
.ofm .qty span{min-width:58px; font-size:1.2rem; font-family:"Outfit","Cairo",sans-serif}
.ofm-sum{display:grid; gap:8px; padding:14px 16px; border-radius:18px; background:var(--surface); border:1.5px dashed var(--line); font-size:.95rem}
.ofm-sum .row{display:flex; justify-content:space-between; align-items:center}
.ofm-sum .tot{border-top:1px dashed var(--line); padding-top:10px; margin-top:2px; font-size:1.2rem}
.ofm-cta{width:100%; padding:16px; font-size:1.08rem; font-weight:900; border-radius:16px; background:var(--grad); color:#fff;
  box-shadow:0 16px 30px -16px var(--accent); position:relative; overflow:hidden; gap:10px}
.ofm-cta::before{content:""; position:absolute; inset:0; pointer-events:none; transform:translateX(-100%);
  background:linear-gradient(100deg,transparent 35%,rgba(255,255,255,.35) 50%,transparent 65%); animation:ofmShine 3.2s ease-in-out infinite}
.ofm-cta:disabled{opacity:.7; cursor:wait}
.ofm-trust{display:flex; flex-wrap:wrap; gap:7px; justify-content:center}
.ofm-trust span{font-size:.74rem; font-weight:700; color:var(--muted); background:var(--surface-2); border-radius:999px; padding:5px 11px}
@keyframes ofmShine{0%{transform:translateX(-100%)} 55%,100%{transform:translateX(100%)}}
@keyframes ofmShake{25%{transform:translateX(-4px)} 75%{transform:translateX(4px)}}
@media (prefers-reduced-motion:reduce){ .ofm-cta::before{animation:none} .ofm .field.err{animation:none} .dcard{transition:none} }

/* ---------- color / size options ---------- */
.zsws{display:flex; flex-wrap:wrap; gap:8px}
.zsw{display:inline-flex; align-items:center; gap:8px; border:1.5px solid var(--line); background:var(--surface); border-radius:999px;

/* Firestore adapter — same tiny interface the rest of the app already uses. */
function fbAdapter(){
  const F=window.FB;
  const mkDoc = p => ({
    get:    async()=>{ const s=await F.getDoc(F.docRef(p)); return {id:s.id, exists:s.exists(), data:()=>s.data()}; },
    set:    d=>F.setDoc(F.docRef(p), d),
    update: d=>F.updateDoc(F.docRef(p), d),
    delete: ()=>F.deleteDoc(F.docRef(p))
  });
  const mkQ = (p, cs=[]) => ({
    orderBy:(f,d)=>mkQ(p,[...cs,F.orderBy(f,d||'asc')]),
    limit:n=>mkQ(p,[...cs,F.limit(n)]),
    doc:id=>mkDoc(p+'/'+id),
    get:async()=>{ const s=await F.getDocs(F.query(F.colRef(p),...cs));
      return {docs:s.docs.map(d=>({id:d.id, exists:true, data:()=>d.data()}))}; },
    onSnapshot:(cb,err)=>F.onSnapshot(F.query(F.colRef(p),...cs),
      s=>cb({docs:s.docs.map(d=>({id:d.id, exists:true, data:()=>d.data()}))}), err)
  });
  return { doc:mkDoc, collection:mkQ };
}

function makeSampler(key){
  return async (prompt)=>{
    const r = await fetch("https://api.anthropic.com/v1/messages",{
      method:"POST",
      headers:{ "content-type":"application/json", "x-api-key":key,
                "anthropic-version":"2023-06-01",
                "anthropic-dangerous-direct-browser-access":"true" },
      body: JSON.stringify({ model:"claude-sonnet-4-6", max_tokens:1200,
                             messages:[{role:"user", content:prompt}] })
    });
    const d = await r.json();
    if(d.error) throw new Error(d.error.message);
    return { text: d.content.filter(b=>b.type==="text").map(b=>b.text).join("\n") };
  };
}

const FS_BASE='https://firestore.googleapis.com/v1/projects/'+((window.FIREBASE_CONFIG||{}).projectId||'')+'/databases/(default)/documents/';
function fsVal(v){
  if('stringValue' in v) return v.stringValue;
  if('integerValue' in v) return Number(v.integerValue);
  if('doubleValue' in v) return v.doubleValue;
  if('booleanValue' in v) return v.booleanValue;
  if('timestampValue' in v) return v.timestampValue;
  if('mapValue' in v) return fsObj(v.mapValue.fields||{});
  if('arrayValue' in v) return (v.arrayValue.values||[]).map(fsVal);
  return null;
}
function fsObj(f){ const o={}; for(const k in f) o[k]=fsVal(f[k]); return o; }
async function fastLoad(){

    else{

      if(!a.ok || !b.ok) return false;
      pj=await a.json(); sj=await b.json();

    if(!pj || !sj) return false;                     // بدون الإعدادات (أسعار التوصيل) لا نعرض شيئاً خاطئاً
    const products=(pj.documents||[]).map(d=>({id:d.name.split('/').pop(), ...fsObj(d.fields||{})}));

/* ---- lifetime order counters (survive delete/archive — see DEFAULT_SETTINGS.stats) ---- */
function ensureStats(){
  if(!S.settings.stats) S.settings.stats = {count:0,pending:0,confirmed:0,shipped:0,done:0,cancelled:0,revenue:0};
  return S.settings.stats;
}
function bumpStatsOnCreate(o){
  const s = ensureStats();
  s.count = (s.count||0)+1;
  s.pending = (s.pending||0)+1;
  s.revenue = (s.revenue||0) + (Number(o.total)||0);
}
function bumpStatsOnStatusChange(oldStatus, newStatus, total){
  if(oldStatus===newStatus) return;
  const s = ensureStats();
  if(oldStatus && s[oldStatus]!=null) s[oldStatus]=Math.max(0,(s[oldStatus]||0)-1);
  if(newStatus) s[newStatus]=(s[newStatus]||0)+1;
  const wasCancelled=oldStatus==='cancelled', isCancelled=newStatus==='cancelled';
  if(wasCancelled && !isCancelled) s.revenue=(s.revenue||0)+(Number(total)||0);
  else if(!wasCancelled && isCancelled) s.revenue=(s.revenue||0)-(Number(total)||0);
}
/* Manual, explicit reset of the lifetime counters only — never touches
   S.orders, so today's live order list/table is completely unaffected. */
async function resetStats(){
  if(!confirm('سيتم تصفير كل عدادات لوحة التحكم (الطلبات، الحالات، المجموع الكلي) إلى 0. هذا لا يحذف أي طلبية ولا يمكن التراجع عنه بعد التأكيد. متابعة؟')) return;
  S.settings.stats = {count:0,pending:0,confirmed:0,shipped:0,done:0,cancelled:0,revenue:0};
  await saveSettings();
  render();
  toast('✅ تم تصفير العداد');
}
async function addOrder(o){
  if(!DB && cloudConfigured() && S._cloudP){ try{ await S._cloudP; }catch(e){} }   // لا نحفظ الطلب محلياً بالخطأ قبل جاهزية Firebase
  o.createdAt = new Date().toISOString();

/* ---------------------------------------------------------------------------
   Isolated, auto-sizing product description.
   Admin-pasted descriptions sometimes arrive as a full HTML page (their own
   <style>, fixed pixel widths, a wrapping <div id="root">…). Injecting that
   straight into the storefront's DOM makes its CSS apply globally — that is
   exactly why formatting used to break on both phone and desktop at once.
   Loading it inside a sandboxed iframe keeps its markup/CSS fully contained,
   then this code measures the frame's real content height (after layout AND
   after every image finishes loading) and applies it to the frame element,
   so the frame is never scrollable and always matches its content — on any
   screen size, automatically. ------------------------------------------- */
function mountDescFrame(){
  const ifr = document.getElementById('descFrame'); if(!ifr) return;
  const p = byId(S.productId); if(!p) return;
  const html = L(p.desc) || `<p style="color:#9a8fae">${esc(t('noProducts'))}</p>`;
  const cs = getComputedStyle(document.documentElement);
  const v = name => (cs.getPropertyValue(name)||'').trim();
  const dir = document.documentElement.dir || 'rtl';
  const doc = `<!doctype html><html dir="${dir}"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&family=Outfit:wght@400;600&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box}
html,body{margin:0; padding:0}
body{font-family:"Cairo","Outfit",system-ui,-apple-system,sans-serif; font-size:16px; line-height:1.9;
  color:${v('--ink')||'#241539'}; background:transparent; overflow-x:hidden; word-wrap:break-word; overflow-wrap:anywhere}
img,video{max-width:100% !important; width:auto; height:auto !important; display:block; margin:12px auto; border-radius:16px}
iframe{max-width:100% !important; width:100%; aspect-ratio:16/9; border:0; border-radius:16px}
h1,h2,h3,h4{line-height:1.3; margin:18px 0 8px; font-weight:800}
p{margin:10px 0}
ul,ol{padding-inline-start:22px; margin:10px 0}
li{margin:5px 0}
a{color:${v('--brand-ink')||'#C74E00'}}
table{border-collapse:collapse; max-width:100%; width:100%}
td,th{border:1px solid ${v('--line')||'#F1E1CE'}; padding:7px 10px; font-size:.9rem}
.tbl-wrap{max-width:100%; overflow-x:auto; -webkit-overflow-scrolling:touch; border-radius:10px}
pre{max-width:100%; overflow-x:auto}
*{max-width:100%}
</style></head><body>${html}</body></html>`;
  ifr.srcdoc = doc;
  ifr.onload = () => {
    let cdoc; try{ cdoc = ifr.contentDocument; }catch(e){ return; }
    if(!cdoc) return;
    cdoc.querySelectorAll('table').forEach(tb=>{
      if(tb.parentElement && tb.parentElement.classList.contains('tbl-wrap')) return;
      const wrap=cdoc.createElement('div'); wrap.className='tbl-wrap';
      tb.parentNode.insertBefore(wrap, tb); wrap.appendChild(tb);
    });
    const resize = () => {
      if(ifr.isConnected===false) return;
      const h = Math.max(cdoc.documentElement.scrollHeight, cdoc.body.scrollHeight);
      ifr.style.height = (h+4)+'px';
    };
    resize();
    try{ new ResizeObserver(resize).observe(cdoc.body); }catch(e){}
    cdoc.querySelectorAll('img').forEach(img=>{
      if(!img.complete) img.addEventListener('load', resize);
      img.addEventListener('error', resize);
    });
    window.addEventListener('resize', resize);
  };
}

const safeHex = h => /^#[0-9a-fA-F]{3,8}$/.test(h||'') ? h : '#cccccc';
const pColors = p => (p && p.colorsOn && Array.isArray(p.colors)) ? p.colors.filter(c=>c && c.name) : [];
const pSizes  = p => (p && p.sizesOn && Array.isArray(p.sizes)) ? p.sizes.filter(Boolean) : [];

function pickColor(i){
  const p=byId(S.productId); if(!p) return; const c=pColors(p)[i]; if(!c) return;
  SEL_COLOR=i;
  document.querySelectorAll('#f_colorGrp .zsw').forEach((b,k)=>{ b.dataset.on=k===i?'1':''; b.setAttribute('aria-pressed',k===i?'true':'false'); });
  document.getElementById('f_colorName').textContent='— '+c.name;
  document.getElementById('f_colorGrp').classList.remove('err');
  const idx = c.img ? (p.images||[]).indexOf(c.img) : -1, pv=document.getElementById('f_colorPrev');
  COLOR_IMG=idx;
  if(idx>=0){
    const im=pv.querySelector('img'); im.onerror=()=>{ im.onerror=null; im.src=c.img; }; im.src=cimg(c.img,300);
    pv.hidden=false;
    if(window.matchMedia('(min-width:960px)').matches) showColorImg();   // على الحاسوب النموذج ثابت بجانب الصور، فننتقل للصورة مباشرة

function showColorImg(){

let QTY=1;
function bumpQty(n){ QTY=Math.max(1,Math.min(99,QTY+n)); document.getElementById('f_qty').textContent=QTY; recalc(); }
function wireOrderForm(){
  QTY=1; SEL_COLOR=null; SEL_SIZE=null; COLOR_IMG=-1;
  const w=document.getElementById('f_wilaya'); if(!w) return;
  const _f=document.getElementById('orderForm');
  ['input','change'].forEach(ev=>_f.addEventListener(ev,e=>e.target.classList&&e.target.classList.remove('err')));
  w.addEventListener('change',()=>{
    const wc=w.value, sel=document.getElementById('f_commune');
    const row=DZ.find(x=>String(x[0])===String(wc));
    sel.innerHTML=`<option value="">${t('pickCommune')}</option>`+
      (row?row[3].map(c=>`<option value="${esc(c)}">${esc(c)}</option>`).join(''):'')+
      `<option value="__other">${t('other')}</option>`;
    document.getElementById('f_commune_other').classList.add('hidden');
    recalc();
  });
  document.getElementById('f_commune').addEventListener('change',e=>{
    document.getElementById('f_commune_other').classList.toggle('hidden', e.target.value!=='__other');
  });
  document.querySelectorAll('input[name="dtype"]').forEach(r=>r.addEventListener('change',()=>{
    document.getElementById('rc_home').dataset.on = r.form.dtype.value==='home'?'1':'';
    document.getElementById('rc_desk').dataset.on = r.form.dtype.value==='desk'?'1':'';
    recalc();
  }));
  recalc();
}
function recalc(){
  const p=byId(S.productId); if(!p) return;
  const wc=document.getElementById('f_wilaya')?.value;
  const type=document.querySelector('input[name="dtype"]:checked')?.value||'home';
  const h=document.getElementById('p_home'), dk=document.getElementById('p_desk');
  const pm=v=>v==null?'—':money(v);
  if(wc){ h.textContent=pm(shipFor(wc,'home')); dk.textContent=pm(shipFor(wc,'desk')); }
  else { h.textContent='—'; dk.textContent='—'; }
  const sub=p.price*QTY, ship=wc?(shipFor(wc,type)||0):0;
  document.getElementById('s_sub').textContent=money(sub);
  document.getElementById('s_ship').textContent=(wc&&shipFor(wc,type)!=null)?money(ship):'—';
  document.getElementById('s_total').textContent=money(sub+ship);
}
async function submitOrder(pid){
  const p=byId(pid); if(!p) return;
  const g=id=>document.getElementById(id)?.value.trim()||'';
  let commune=g('f_commune'); if(commune==='__other') commune=g('f_commune_other');
  const phone=g('f_phone').replace(/\s|-/g,'');
  const wc=g('f_wilaya');
  const bad=[];
  if(!g('f_name')) bad.push('f_name');
  if(!phone) bad.push('f_phone');
  if(!wc) bad.push('f_wilaya');
  if(!commune) bad.push(g('f_commune')==='__other'?'f_commune_other':'f_commune');
  if(bad.length){ bad.forEach(id=>document.getElementById(id)?.classList.add('err')); document.getElementById(bad[0])?.focus(); return toast(t('required')); }
  if(!/^0?[5-7]\d{8}$/.test(phone)){ const el=document.getElementById('f_phone'); el.classList.add('err'); el.focus(); return toast(t('badPhone')); }
  const cs=pColors(p), ss=pSizes(p);
  if(cs.length && SEL_COLOR==null){ const e=document.getElementById('f_colorGrp'); e.classList.add('err'); e.scrollIntoView({block:'center',behavior:'smooth'}); return toast(t('pickColorReq')); }
  if(ss.length && SEL_SIZE==null){ const e=document.getElementById('f_sizeGrp'); e.classList.add('err'); e.scrollIntoView({block:'center',behavior:'smooth'}); return toast(t('pickSizeReq')); }
  const type=document.querySelector('input[name="dtype"]:checked')?.value||'home';
  const row=DZ.find(x=>String(x[0])===String(wc));
  const ship=shipFor(wc,type), sub=p.price*QTY;
  if(ship==null) return toast(t('noPrice'));
  const btn=document.getElementById('submitBtn');
  btn.disabled=true; btn.innerHTML=`<span class="spinner"></span> ${t('sending')}`;
  const order=await addOrder({
    productId:p.id, productName:L(p.name), unitPrice:p.price, qty:QTY,
    color:cs.length?cs[SEL_COLOR].name:'', size:ss.length?ss[SEL_SIZE]:'',
    customer:g('f_name'), phone, phone2:'',
    wilayaCode:Number(wc), wilaya:row?row[2]:'', wilayaAr:row?row[1]:'',
    commune, address:'', notes:'',
    deliveryType:type, carrier:(activeCarrier()||{}).name||'', shipping:ship, subtotal:sub, total:sub+ship, lang:LANG
  });
  S.lastOrder=order;
  trackPurchase(order);
  go('success');
}

function cloudinaryReady(){
  const c=window.CLOUDINARY||{};
  return c.CLOUD_NAME && c.UPLOAD_PRESET && !c.CLOUD_NAME.includes('PASTE');
}
/** Uploads one file to Cloudinary (unsigned) and returns a permanent, light-weight URL —
 *  nothing but that short URL string is ever stored in Firestore. */
async function uploadToCloudinary(file){
  const c=window.CLOUDINARY;
  const fd=new FormData();
  fd.append('file', file);
  fd.append('upload_preset', c.UPLOAD_PRESET);
  fd.append('folder', 'zoubirnasrishop');
  const res=await fetch(`https://api.cloudinary.com/v1_1/${c.CLOUD_NAME}/image/upload`, {method:'POST', body:fd});
  const data=await res.json();
  if(data.error) throw new Error(data.error.message);
  // f_auto,q_auto: Cloudinary serves an optimized, auto-compressed format to each visitor
  return data.secure_url.replace('/upload/', '/upload/f_auto,q_auto,w_1200/');
}
async function uploadImgs(input){
  const useCloud = cloudinaryReady();
  const bar=document.getElementById('d_imgs');
  for(const file of input.files){
    const tempId = 'up_'+Math.random().toString(36).slice(2);
    bar.insertAdjacentHTML('beforeend', `<div class="skel" id="${tempId}" style="width:76px;height:76px;border-radius:12px"></div>`);
    try{
      const url = useCloud ? await uploadToCloudinary(file) : await compress(file);
      DRAFT.images.push(url);
      if(!useCloud) toast('⚠︎ Cloudinary غير مُفعّل — تم الحفظ محلياً (أثقل). راجع الإعدادات.');
    }catch(e){
      try{ DRAFT.images.push(await compress(file)); toast('⚠︎ Cloudinary: '+e.message+' — تم الحفظ محلياً بدلاً منه'); }
      catch(_){ toast('⚠︎ فشل رفع الصورة'); }
    }
    document.getElementById(tempId)?.remove();
  }
  input.value=''; refreshImgs();
}
function compress(file, max=1000, q=.72){
  return new Promise((res,rej)=>{
    const r=new FileReader();
    r.onload=()=>{ const im=new Image();
      im.onload=()=>{ const sc=Math.min(1,max/Math.max(im.width,im.height));
        const c=document.createElement('canvas'); c.width=im.width*sc; c.height=im.height*sc;
        c.getContext('2d').drawImage(im,0,0,c.width,c.height); res(c.toDataURL('image/jpeg',q)); };
      im.onerror=rej; im.src=r.result; };
    r.onerror=rej; r.readAsDataURL(file);
  });
}

/* ============ Colex (EcoTrack) — الإرسال عبر السيرفر الوسيط ============
   المتصفح يكلّم السيرفر الوسيط فقط (colex-proxy على Render)؛ توكن Colex يبقى هناك. */
function colexSecret(){ try{ return localStorage.getItem('zn_colex_secret')||''; }catch(e){ return ''; } }
function colexUrl(){ let u=S.integ&&S.integ.proxyUrl; if(!u){ try{ u=localStorage.getItem('zn_colex_proxy')||''; }catch(e){} } return String(u||'').trim().replace(/\/+$/,''); }
function colexTracking(v,d){
  d=d||0; if(v==null||d>4) return '';
  if(typeof v==='object'){
    for(const [k,x] of Object.entries(v)){ if(/^tracking/i.test(k) && (typeof x==='string'||typeof x==='number') && String(x).trim()) return String(x).trim(); }
    for(const x of Object.values(v)){ const r=colexTracking(x,d+1); if(r) return r; }
  }
  return '';
}
function colexErrText(j){
  if(!j) return 'لا يوجد رد';
  if(j.error==='unauthorized') return 'كلمة السر غير صحيحة (ADMIN_SECRET)';
  if(j.error==='missing_fields') return 'بيانات ناقصة/خاطئة: '+(j.fields||[]).join(', ');
  if(j.error==='colex_unreachable') return 'تعذّر الوصول إلى Colex';
  if(j.error) return String(j.error);
  const c=j.colex, st=j.status?(' [HTTP '+j.status+']'):'';
  const hint={401:'التوكن مرفوض أو غير صحيح',403:'ممنوع — راجع التوكن وصلاحيات الحساب',404:'المسار غير موجود',405:'الطريقة غير مسموحة',419:'الجلسة منتهية',429:'طلبات كثيرة، انتظر دقيقة',500:'خطأ من خادم Colex',502:'خطأ من خادم Colex',503:'خادم Colex غير متاح'}[j.status]||'';
  let body='';
  if(typeof c==='string') body=c.replace(/<[^>]*>/g,' ').replace(/\s+/g,' ').trim().slice(0,160);
  else if(c!=null) body=JSON.stringify((c&&(c.errors||c.message||c.error))||c).slice(0,200);
  if(!body && c==null) body='الرد: '+JSON.stringify(j).slice(0,200);
  return ([hint,body].filter(Boolean).join(' — ')||'فشل الإرسال بدون أي تفاصيل من Colex')+st;
}
function colexShort(txt){

const CX_AR={'ا':'a','أ':'a','إ':'i','آ':'a','ب':'b','ت':'t','ث':'th','ج':'dj','ح':'h','خ':'kh','د':'d','ذ':'d','ر':'r','ز':'z','س':'s','ش':'ch','ص':'s','ض':'d','ط':'t','ظ':'z','ع':'a','غ':'gh','ف':'f','ق':'k','ك':'k','ل':'l','م':'m','ن':'n','ه':'h','ة':'a','و':'ou','ي':'i','ى':'a','ء':'','ئ':'i','ؤ':'ou','گ':'g','ڤ':'v','پ':'p'};
function cxHasAr(s){ return /[\u0600-\u06FF]/.test(String(s||'')); }
function cxAr2Lat(s){
  s=String(s||'').replace(/[\u064B-\u065F\u0670\u0640]/g,'');
  return s.split(/\s+/).filter(Boolean).map(w=>{
    let pre=''; if(/^ال/.test(w)&&w.length>3){ pre='El '; w=w.slice(2); }
    let o=''; for(const c of w) o+=(CX_AR[c]!==undefined?CX_AR[c]:c);

}
function cxSkel(s){

  s=s.split(/\s+/).filter(w=>w&&w!=='el'&&w!=='al'&&w!=='el-'&&w!=='de'&&w!=='des'&&w!=='du').join('');
  s=s.replace(/ou/g,'').replace(/ph/g,'f').replace(/th/g,'t').replace(/dh/g,'d').replace(/sh|ch/g,'x').replace(/kh/g,'k')
     .replace(/gh/g,'g').replace(/dj/g,'j').replace(/ck/g,'k').replace(/q/g,'k').replace(/c/g,'k')

function cxSplit(written,list){
  const w=String(written||'').trim(); if(!w) return {commune:'',rest:''};
  list=list||[];

function cxCommuneCands(written,list){

function ordersTable(sep){
  const head=["ref","date","customer","phone","phone2","wilaya_code","wilaya","commune","address",
    "delivery","product","qty","unit_price","shipping","total","status","notes","color","size"];
  const rows=S.orders.map(o=>[o.ref||o.id, o.createdAt, o.customer, o.phone, o.phone2||'',
    o.wilayaCode, o.wilaya, o.commune, (o.address||'').replace(/[\r\n]+/g,' '),
    o.deliveryType==='home'?'Domicile':'Bureau', o.productName, o.qty, o.unitPrice, o.shipping, o.total,
    o.status, (o.notes||'').replace(/[\r\n]+/g,' '), o.color||'', o.size||'']);
  const q=v=>{ v=String(v==null?'':v); return sep===','? '"'+v.replace(/"/g,'""')+'"' : v; };
  return [head.join(sep), ...rows.map(r=>r.map(q).join(sep))].join('\r\n');
}
async function exportCsv(){
  const csv="\uFEFF"+ordersTable(",");              // UTF-8 BOM → Arabic opens correctly in Excel
  const filename=`ZoubirNasriShop-orders-${new Date().toISOString().slice(0,10)}.csv`;
  if(DOWNLOADS){ try{ await DOWNLOADS.save({filename, data:csv}); return toast('✅ '+t('exportCsv')); }catch(e){} }
  try{ const a=document.createElement('a');
    a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'})); a.download=filename; a.click();
  }catch(e){ await navigator.clipboard.writeText(csv); toast(t('copied')); }
}
/* Sends rows to the Google Apps Script web app. `no-cors` means we never
   read the reply — Apps Script does not send CORS headers — but the rows
   do arrive in the sheet. */
function pushSheet(orders){
  const url = S.settings.sheetUrl || window.SHEETS_URL;
  if(!url || !orders?.length) return;
  const rows = orders.map(o=>[o.ref||o.id,
    new Date(o.createdAt).toLocaleString('fr-DZ',{timeZone:'Africa/Algiers'}),
    o.customer, o.phone, o.phone2||'', String(o.wilayaCode).padStart(2,'0'),
    o.wilayaAr||o.wilaya, o.commune, o.address,
    o.deliveryType==='home'?'المنزل':'المكتب',
    o.productName, o.qty, o.unitPrice, o.shipping, o.total, o.status, o.notes||'', o.color||'', o.size||'']);
  fetch(url,{method:'POST', mode:'no-cors',
    headers:{'Content-Type':'text/plain;charset=utf-8'},
    body: JSON.stringify({token:'ZN', rows})}).catch(()=>{});
}
/* Each order is already sent to the sheet once, the moment it's created
   (see pushSheet() call in addOrder, which sets o.sheetSynced) — that's the
   live backup. Archiving only needs to (re-)send orders that were never
   synced — e.g. created before a Sheets link existed, or a push that failed
   — then clear everything out of the store; already-synced orders are only
   deleted here, never re-pushed, so nothing ends up duplicated in the sheet. */
async function archiveSheets(){
  if(!S.orders.length) return toast('لا توجد طلبات لأرشفتها');
  const url = S.settings.sheetUrl || window.SHEETS_URL;
  if(url){
    const notSynced = S.orders.filter(o=>!o.sheetSynced);
    const msg = notSynced.length
      ? `سيتم إرسال ${notSynced.length} طلبية غير مسجّلة بعد إلى Google Sheets، ثم حذف كل الطلبات (${S.orders.length}) من المتجر. هل أنت متأكد؟`
      : `سيتم حذف ${S.orders.length} طلبية من المتجر (هي محفوظة أصلاً في Google Sheets منذ إنشائها). هل أنت متأكد؟`;
    if(!confirm(msg)) return;
    if(notSynced.length) pushSheet(notSynced);
    const ok = await deleteAllOrders();
    if(ok) toast('✅ تم حذف الطلبات من المتجر — نسختها محفوظة في Google Sheets');
    return;
  }
  try{
    await navigator.clipboard.writeText(ordersTable("\t"));
    toast('📋 '+t('copied')+' → الصق الجدول في Google Sheets (Ctrl+V)');
    if(confirm('هل قمت بلصق الجدول في Google Sheets؟ في حال الموافقة، سيتم حذف الطلبات من المتجر.')){
      const ok = await deleteAllOrders();
      if(ok) toast('✅ تم حذف الطلبات من المتجر');
    }
  }catch(e){ toast('⚠︎ '+e.message); }
}
async function deleteAllOrders(){
  const ids = S.orders.map(o=>o.id);
  let failed = 0;
  for(const id of ids){
    const ok = await removeOrder(id);
    if(!ok) failed++;
  }
  if(S.tab==='orders') render();
  if(failed){
    toast(`⚠︎ تعذّر حذف ${failed} من أصل ${ids.length} طلبية — تأكد من نشر صلاحية الحذف (allow delete) في Firestore Rules`);
    return false;
  }
  return true;
}

/* ---- import des tarifs depuis un PDF (pdf.js charge seulement au clic, jamais pour les clients) ---- */
let _pdfjs=null;
async function loadPdfJs(){
  if(_pdfjs) return _pdfjs;
  const base='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/';
  await new Promise((ok,ko)=>{ const sc=document.createElement('script'); sc.src=base+'pdf.min.js'; sc.onload=ok; sc.onerror=()=>ko(new Error('pdfjs')); document.head.appendChild(sc); });
  const code=await (await fetch(base+'pdf.worker.min.js')).text();      // worker via Blob (evite le blocage cross-origin)
  window.pdfjsLib.GlobalWorkerOptions.workerSrc=URL.createObjectURL(new Blob([code],{type:'text/javascript'}));
  return _pdfjs=window.pdfjsLib;
}
const normName=s=>String(s||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f\u064b-\u065f\u0670\u0640]/g,'').replace(/ى/g,'ي').replace(/ة/g,'ه').replace(/[^a-z0-9\u0600-\u06ff]/g,'');
function parsePriceItems(pages){
  const idx=DZ.map(w=>({code:w[0], keys:[normName(w[1]),normName(w[2])].filter(k=>k.length>=3)}));
  const found={}; let cols=null, auto=false;
  const reHome=/domicile|home|منزل|المنزل|للمنزل/i, reDesk=/desk|bureau|relais|مكتب|المكتب|للمكتب|ستوب/i;
  pages.forEach(items=>{
    // colonnes : en-tetes "domicile" / "desk" les plus hauts de la page
    const top=[...items].sort((a,b)=>b.y-a.y);
    const h=top.find(i=>reHome.test(i.s)), d=top.find(i=>reDesk.test(i.s));
    if(h&&d&&Math.abs((h.x+h.w/2)-(d.x+d.w/2))>20){ cols={home:h.x+h.w/2, desk:d.x+d.w/2}; auto=true; }
    // lignes : regroupement par y
    const rows=[]; top.forEach(it=>{ const r=rows.find(r=>Math.abs(r.y-it.y)<=4); if(r) r.items.push(it); else rows.push({y:it.y, items:[it]}); });
    rows.forEach(r=>{
      r.items.sort((a,b)=>a.x-b.x);
      const prices=[]; let code=null, text='';
      r.items.forEach((it,i)=>{
        const raw=it.s.trim(), p=raw.replace(/\s*(da|dzd|دج|د\.ج)\.?$/i,'').replace(/[\s,.]/g,'');
        if(/^\d{3,5}$/.test(p) && Number(p)>=100) prices.push({v:Number(p), x:it.x+it.w/2});
        else{ const m=raw.match(/^(\d{1,2})(?:\s*[-–.)]|\s|$)/); if(m && code==null && Number(m[1])>=1 && Number(m[1])<=58) code=Number(m[1]); }
        text+=(i&&it.x-(r.items[i-1].x+r.items[i-1].w)>1.5?' ':'')+raw;
      });
      if(!prices.length) return;
      const nt=normName(text); let best=null, bl=0;
      idx.forEach(w=>w.keys.forEach(k=>{ if(nt.includes(k)&&k.length>bl){ best=w.code; bl=k.length; } }));
      const wc=best||code; if(!wc||found[wc]) return;
      let home=null, desk=null;
      if(cols){
        const byCol={home:[],desk:[]};
        prices.forEach(p=>byCol[Math.abs(p.x-cols.home)<=Math.abs(p.x-cols.desk)?'home':'desk'].push(p.v));
        if(byCol.home.length<=1&&byCol.desk.length<=1){ home=byCol.home[0]??null; desk=byCol.desk[0]??null; }
        else { const l=prices.slice(0,2).map(p=>p.v); [home,desk]=cols.home<cols.desk?l:[l[1],l[0]]; }
      } else { home=prices[0].v; desk=prices.length>1?prices[1].v:null; }
      found[wc]={code:wc, home, desk};
    });
  });
  return {rows:Object.values(found).sort((a,b)=>a.code-b.code), auto};
}
async function importPdf(input){
  const f=input.files&&input.files[0]; if(!f) return;
  toast(t('impLoading'));
  try{
    const lib=await loadPdfJs();
    const pdf=await lib.getDocument({data:await f.arrayBuffer()}).promise, pages=[];
    for(let i=1;i<=Math.min(pdf.numPages,30);i++){
      const tc=await (await pdf.getPage(i)).getTextContent();
      pages.push(tc.items.map(it=>({s:it.str, x:it.transform[4], y:it.transform[5], w:it.width||0})).filter(it=>it.s.trim()));
    }
    const res=parsePriceItems(pages);
    if(!res.rows.length){ S.imp=null; toast(t('impNone')); }
    else S.imp={carrierId:editCarrier().id, ...res};
  }catch(e){ console.warn(e); S.imp=null; toast(t('impFail')); }
  render();
}

  const toneName={hype:"high-energy, urgent, emoji-rich",trust:"professional, reassuring, benefit-led",story:"short storytelling hook"}[tone];
  const prompt=`You write ${plat} ads for an Algerian e-commerce store paying cash on delivery (COD).
Product: ${L(p.name)}
Price: ${p.price} DA${p.oldPrice?` (was ${p.oldPrice} DA)`:''}
Details: ${stripTags(L(p.desc)).slice(0,700)}
Store: ZoubirNasriShop — WhatsApp 0542248858, delivery to all 58 wilayas, payment on delivery.

Write the ad in ${langName}, in a ${toneName} tone. Return exactly this structure, nothing else:
1) three scroll-stopping headlines (max 8 words each)
2) a primary ad text of 60–90 words with benefits as short lines
3) one call to action mentioning cash on delivery and the phone number
4) 12 hashtags suited to the Algerian market
5) a 15-second video script idea in 3 shots.`;
  try{
    const r=await SAMPLE(prompt,{modelTier:"default", onText:({text})=>{ out.textContent=text; }});
    out.textContent=r.text; document.getElementById('aiCopy').classList.remove('hidden');
  }catch(e){ out.textContent='⚠︎ '+(e.code||e.message); }
  btn.disabled=false; btn.innerHTML='✨ '+t('aiGenerate');
}

/* ---- settings tab: multi-pixel rows ---- */
const PX_PH = {fb:"1234567890123456", tt:"C4A1B2C3D4E5F6G7H8I9"};
function pxRow(kind, v){
  return `<div class="pxrow" style="display:flex; gap:8px; margin-bottom:8px"><input class="field px-${kind}" style="flex:1" placeholder="${PX_PH[kind]}" value="${esc(v)}"><button type="button" class="btn btn-ghost" onclick="this.parentNode.remove()" aria-label="remove">✕</button></div>`;
}
function pxBox(kind, val){
  const l = pxList(val);
  return `<div id="px_${kind}">${(l.length?l:['']).map(v=>pxRow(kind,v)).join('')}</div>
    <button type="button" class="btn btn-ghost" onclick="pxAdd('${kind}')">＋ ${t('addPixel')}</button>`;
}
function pxAdd(kind){
  const box=document.getElementById('px_'+kind), tmp=document.createElement('div');
  tmp.innerHTML=pxRow(kind,''); box.appendChild(tmp.firstChild); box.lastChild.querySelector('input').focus();
}

async function commitSettings(){
  const g=i=>document.getElementById(i).value.trim();
  const aik=g('st_ai');
  if(aik){ localStorage.setItem('zn_aikey',aik); SAMPLE=makeSampler(aik); }
  else { localStorage.removeItem('zn_aikey'); SAMPLE=null; }
  Object.assign(S.settings,{storeName:g('st_name'),    whatsapp:g('st_wa'),facebook:g('st_fb'),sheetUrl:g('st_sheet'),
    fbPixel:pxList([...document.querySelectorAll('.px-fb')].map(i=>i.value).join(',')).join(','),
    ttPixel:pxList([...document.querySelectorAll('.px-tt')].map(i=>i.value).join(',')).join(',')});
  await saveSettings(); loadPixels(); toast(t('saved')); render();
}

/* ============ Shipping API connections (private tokens) ============
   Stored in Firestore doc  private/shipping  (NOT in shop/settings, which is public).
   Firestore rules must allow read/write on /private/** only for signed-in admin. */
const INTEG_PRESETS = {
  generic:{label:'مخصص (Custom)', url:''},
  yalidine:{label:'Yalidine', url:'https://api.yalidine.app/v1/'},
  zrexpress:{label:'ZR Express', url:''},
  colex:{label:'Colex Express (EcoTrack)', url:'https://colex.ecotrack.dz'},
  ecotrack:{label:'EcoTrack / مشتقاتها', url:''},
  other:{label:'أخرى', url:''}
};
S.integ = S.integ || {providers:[], loaded:false, proxyUrl:''};
async function integLoad(){
  try{
    if(DB){ const d=await DB.doc('private/shipping').get(); S.integ.providers = (d.exists && d.data().providers) || []; S.integ.proxyUrl = (d.exists && d.data().proxyUrl) || ''; }
    else { S.integ.providers = JSON.parse(localStorage.getItem('zn_integ')||'[]'); }
  }catch(e){ console.warn('integ load failed (check Firestore rules for /private)', e); S.integ.providers = JSON.parse(localStorage.getItem('zn_integ')||'[]'); }
  try{ if(!S.integ.proxyUrl) S.integ.proxyUrl = localStorage.getItem('zn_colex_proxy')||''; }catch(e){}
  S.integ.loaded=true; if(S.view==='admin' && S.tab==='integ') render();
}
function integCollect(){
  const _pu=document.getElementById('cx_url'); if(_pu) S.integ.proxyUrl=_pu.value.trim().replace(/\/+$/,'');
  const _ps=document.getElementById('cx_secret'); if(_ps){ try{ localStorage.setItem('zn_colex_secret', _ps.value.trim()); }catch(e){} }
  const rows=[...document.querySelectorAll('.ig-row')]; if(!rows.length) return;
  S.integ.providers = rows.map(r=>{
    const g=c=>r.querySelector('.'+c); const old=S.integ.providers.find(p=>p.id===r.dataset.id)||{};
    return {...old, id:r.dataset.id, name:g('ig-name').value.trim(), type:g('ig-type').value,
      apiUrl:g('ig-url').value.trim(), apiId:g('ig-apiid').value.trim(), token:g('ig-token').value.trim(),
      enabled:g('ig-on').checked, isDefault:g('ig-def').checked};
  });
  // only one default
  let seen=false; S.integ.providers.forEach(p=>{ if(p.isDefault){ if(seen) p.isDefault=false; seen=true; } });
}
async function integSave(quiet){
  integCollect();
  const data={providers:S.integ.providers, proxyUrl:S.integ.proxyUrl||'', updatedAt:new Date().toISOString()};
  try{ localStorage.setItem('zn_colex_proxy', S.integ.proxyUrl||''); }catch(e){}
  try{
    if(DB) await DB.doc('private/shipping').set(data);
    else localStorage.setItem('zn_integ', JSON.stringify(S.integ.providers));
    if(!quiet) toast('✅ تم الحفظ');
  }catch(e){ toast('⚠︎ '+(e.code||e.message)+' — تأكد من قواعد Firestore لـ /private'); return false; }
  return true;
}
function integAdd(){
  integCollect();
  S.integ.providers.push({id:'sp_'+Date.now().toString(36), name:'', type:'generic', apiUrl:'', apiId:'', token:'', enabled:true, isDefault:!S.integ.providers.length});
  render();
}
async function integDelete(id){
  integCollect(); const p=S.integ.providers.find(x=>x.id===id);
  if(!confirm('حذف '+(p&&p.name||'هذه الشركة')+'؟')) return;
  S.integ.providers=S.integ.providers.filter(x=>x.id!==id); await integSave(true); render();
}
function integPreset(sel){
  const r=sel.closest('.ig-row'), u=r.querySelector('.ig-url'), pr=INTEG_PRESETS[sel.value];
  if(pr && pr.url && !u.value) u.value=pr.url;
  const n=r.querySelector('.ig-name'); if(pr && sel.value!=='generic' && sel.value!=='other' && !n.value) n.value=pr.label;
}
function integEye(btn){
  const i=btn.parentNode.querySelector('.ig-token'); const show=i.type==='password';
  i.type=show?'text':'password'; btn.textContent=show?'🙈':'👁';
}
async function integCopy(btn){
  const v=btn.parentNode.querySelector('.ig-token').value;
  try{ await navigator.clipboard.writeText(v); toast('📋 تم النسخ'); }catch(e){ toast('تعذّر النسخ'); }
}
function integProviders(){ return (S.integ.providers||[]).filter(p=>p.enabled && p.token); }
function integDefault(){ const l=integProviders(); return l.find(p=>p.isDefault)||l[0]||null; }

  const L=S.integ.providers||[];
  return `<div style="display:grid; gap:14px; max-width:720px">

    </div>

      <p class="muted" style="font-size:.78rem; margin:0">إذا تركت رابط السيرفر فارغًا، يُرسل المتجر مباشرة إلى Colex باستعمال شركة «Colex Express» المضافة في الأسفل (الرابط + التوكن). وإذا المتصفح منع الإرسال المباشر (CORS)، انشر السيرفر الوسيط وحط هنا رابطو وكلمة السر <code>ADMIN_SECRET</code>.</p>
      <input class="field" id="cx_url" dir="ltr" placeholder="https://colex-proxy.onrender.com" value="${esc(S.integ.proxyUrl||'')}">
      <input class="field" id="cx_secret" type="password" dir="ltr" autocomplete="off" placeholder="Admin secret (يُحفظ في هذا المتصفح فقط)" value="${esc(colexSecret())}">
      <div style="display:flex; gap:8px; flex-wrap:wrap; align-items:center">
        <button type="button" class="btn btn-ghost" onclick="colexTest()">🔎 اختبار الاتصال</button>
        <span id="cx_status" class="muted" style="font-size:.78rem"></span>
      </div>
    </div>
    ${L.length?'':'<div class="card" style="padding:18px"><p class="muted" style="margin:0">ما فيه حتى شركة مربوطة. كبس «إضافة شركة توصيل».</p></div>'}
    ${L.map(p=>`<div class="card ig-row" data-id="${esc(p.id)}" style="padding:16px; display:grid; gap:10px">
      <div style="display:flex; gap:8px; flex-wrap:wrap">
        <input class="field ig-name" style="flex:1; min-width:140px" placeholder="اسم الشركة" value="${esc(p.name)}">
        <select class="field ig-type" style="width:auto" onchange="integPreset(this)">
          ${Object.entries(INTEG_PRESETS).map(([k,v])=>`<option value="${k}" ${p.type===k?'selected':''}>${v.label}</option>`).join('')}
        </select>
      </div>
      <input class="field ig-url" placeholder="رابط الـ API (https://…)" value="${esc(p.apiUrl)}" dir="ltr">
      <input class="field ig-apiid" placeholder="API ID (إذا الشركة تطلبه، اختياري)" value="${esc(p.apiId||'')}" dir="ltr">
      <div style="display:flex; gap:8px">
        <input class="field ig-token" type="password" style="flex:1; font-family:monospace" dir="ltr" autocomplete="off" placeholder="API Token" value="${esc(p.token)}">
        <button type="button" class="btn btn-ghost" onclick="integEye(this)" aria-label="show">👁</button>
        <button type="button" class="btn btn-ghost" onclick="integCopy(this)">📋 نسخ</button>
      </div>
      <div style="display:flex; gap:16px; align-items:center; flex-wrap:wrap">
        <label style="display:flex; gap:6px; align-items:center"><input type="checkbox" class="ig-on" ${p.enabled?'checked':''}> مفعّلة</label>
        <label style="display:flex; gap:6px; align-items:center"><input type="checkbox" class="ig-def" ${p.isDefault?'checked':''}> الافتراضية</label>
        <div style="flex:1"></div>
        <button type="button" class="btn btn-ghost btn-sm" onclick="integDelete('${esc(p.id)}')">🗑 حذف</button>
      </div>
    </div>`).join('')}
    <div style="display:flex; gap:10px">
      <button class="btn btn-ghost" onclick="integAdd()">＋ إضافة شركة توصيل</button>
      <button class="btn btn-primary" onclick="integSave()">${t('save')}</button>
    </div>
  </div>`;
}
function toggleTheme(){
  const cur=document.documentElement.getAttribute('data-theme');
  document.documentElement.setAttribute('data-theme', cur==='dark'?'light':'dark');
  localStorage.setItem('zn_theme', document.documentElement.getAttribute('data-theme'));
}
